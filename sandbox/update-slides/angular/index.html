export interface Photo {
    /** Full-size image, shown in the gallery. */
    src: string;
    /** Small image, shown on the page and in the thumbnail strip. */
    thumb: string;
    alt: string;
    /** &#34;WIDTH-HEIGHT&#34; of the full-size image; lets it open from its thumbnail. */
    lgSize: string;
}

const photo = (id: number, alt: string): Photo => ({
    src: `https://picsum.photos/id/${id}/1600/1067`,
    thumb: `https://picsum.photos/id/${id}/360/240`,
    alt,
    lgSize: '1600-1067',
});

export const photos: Photo[] = [
    photo(10, 'Sample photo 1'),
    photo(11, 'Sample photo 2'),
    photo(15, 'Sample photo 3'),
    photo(16, 'Sample photo 4'),
    photo(28, 'Sample photo 5'),

" data-astro-cid-spbtv2v5><input type="hidden" name="project[files][src/app/app.ts]" value="import { Component, signal } from '@angular/core';
import {
    LgCaptionDirective,
    LgGalleryComponent,
    LgGalleryItemDirective,
} from '@lightgallery/angular';

import { photos as firstPhotos, type Photo } from '../photos';

let added = 0;

function newPhoto(): Photo {
    added += 1;
    return {
        src: `https://picsum.photos/seed/lg-added-${added}/1600/1067`,
        thumb: `https://picsum.photos/seed/lg-added-${added}/360/240`,
        alt: `Added photo ${added}`,
        lgSize: '1600-1067',
    };
}

@Component({
    selector: 'app-root',
    imports: [LgCaptionDirective, LgGalleryComponent, LgGalleryItemDirective],
    template: `
        <h1>lightGallery update slides</h1>
        <p>Open a photo, then use the buttons under it.</p>

        <lg-gallery>
            <div class=&#34;gallery&#34;>
                @for (photo of photos(); track photo.src) {
                <a [href]=&#34;photo.src&#34; [lgGalleryItem]=&#34;photo&#34;>
                    <img [src]=&#34;photo.thumb&#34; [alt]=&#34;photo.alt&#34; />
                </a>
                }
            </div>

            <!-- The lgCaption template puts the buttons in the caption
                 area of every slide. -->
            <ng-template lgCaption let-index=&#34;index&#34;>
                <div class=&#34;slide-actions&#34;>
                    <button type=&#34;button&#34; (click)=&#34;add()&#34;>Add a photo</button>
                    <button
                        type=&#34;button&#34;
                        [disabled]=&#34;photos().length === 1&#34;
                        (click)=&#34;remove(index)&#34;
                    >
                        Remove this photo
                    </button>
                </div>
            </ng-template>
        </lg-gallery>
    `,
})
export class App {
    // Updating the signal is the update, also while the gallery is open.
    // There is no method to call.
    readonly photos = signal(firstPhotos);

    add(): void {
        this.photos.update((current) => [...current, newPhoto()]);
    }

    remove(index: number): void {
        this.photos.update((current) => current.filter((_, i) => i !== index));
    }
}
