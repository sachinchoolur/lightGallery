export interface Photo {
    /** Full-size image, shown in the gallery. */
    src: string;
    /** Small image, shown on the page. */
    thumb: string;
    alt: string;
    /** &#34;WIDTH-HEIGHT&#34; of the full-size image; lets it open from its thumbnail. */
    lgSize: string;
    /** The tile's `object-position`: the part of the photo it shows. */
    position: string;
}

const landscape = (id: number, alt: string, position: string): Photo => ({
    src: `https://picsum.photos/id/${id}/1600/1067`,
    thumb: `https://picsum.photos/id/${id}/480/320`,
    alt,
    lgSize: '1600-1067',
    position,
});

const portrait = (id: number, alt: string, position: string): Photo => ({
    src: `https://picsum.photos/id/${id}/1067/1600`,
    thumb: `https://picsum.photos/id/${id}/320/480`,
    alt,
    lgSize: '1067-1600',
    position,
});

export const photos: Photo[] = [
    landscape(10, 'Sample photo 1', '0% 50%'),
    portrait(11, 'Sample photo 2', '50% 0%'),
    landscape(15, 'Sample photo 3', '50% 50%'),
    portrait(16, 'Sample photo 4', '50% 100%'),
    landscape(28, 'Sample photo 5', '100% 50%'),
    portrait(29, 'Sample photo 6', '50% 50%'),
    landscape(37, 'Sample photo 7', '50% 50%'),
    portrait(110, 'Sample photo 8', '50% 0%'),
];
" data-astro-cid-spbtv2v5><input type="hidden" name="project[files][src/App.tsx]" value="import { LightGallery, LightGalleryItem } from '@lightgallery/react';
import OriginCrop from '@lightgallery/react/plugins/originCrop';

import 'lightgallery/css/lightgallery.css';
import './tiles.css';

import { photos } from './photos';

export default function App() {
    return (
        <>
            <h1>lightGallery zoom from origin, cropped thumbnails</h1>
            {/* The tiles are square and crop every photo with object-fit:
                cover. The origin crop plugin flies the part of the photo a
                tile shows and reveals the rest around it; without the
                plugin the whole photo would be squashed into the tile. It
                reads the tile's object-fit and object-position, nothing is
                needed in the markup. */}
            <LightGallery plugins={[OriginCrop]}>
                <div className=&#34;tiles&#34;>
                    {photos.map((photo) => (
                        <LightGalleryItem
                            key={photo.src}
                            item={photo}
                            href={photo.src}
                        >
                            <img
                                src={photo.thumb}
                                alt={photo.alt}
                                style={{ objectPosition: photo.position }}
                            />
                        </LightGalleryItem>
                    ))}
                </div>
            </LightGallery>
        </>
    );
}
