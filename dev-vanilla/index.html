<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>lightgallery — vanilla dev demo</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 0 auto;
                max-width: 960px;
                padding: 24px;
            }
            .demo-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
            }
            .demo-grid a {
                display: block;
            }
            .demo-grid img {
                width: 100%;
                height: 110px;
                object-fit: cover;
                border-radius: 4px;
                display: block;
            }
            /* Tall page so scroll lock/restore is visible. */
            .demo-spacer {
                height: 60vh;
            }
        </style>
    </head>
    <body>
        <h1>lightgallery — vanilla dev demo</h1>
        <p>
            <a href="/justified-slow.html">Justified slow-load page</a> —
            server-rendered markup, Unsplash thumbnails, delayed init.
        </p>
        <p>
            Same images and plugin set as the React dev demo, driving the
            root <code>src/</code> build directly — for side-by-side v2 ↔ v3
            gesture comparison.
        </p>
        <div id="gallery"></div>
        <div class="demo-spacer">(spacer to verify scroll lock/restore)</div>
        <script type="module" src="/main.ts"></script>
    </body>
</html>
