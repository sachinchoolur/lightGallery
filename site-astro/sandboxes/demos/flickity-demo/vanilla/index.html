<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery with Flickity example</title>
    </head>
    <body>
        <h1>lightGallery with a Flickity carousel</h1>

        <!-- Every cell links to its full-size image. data-lg-size is that
             image's WIDTH-HEIGHT; it lets the image open from its cell. -->
        <div id="flickity-carousel" class="main-carousel">
            <a
                class="carousel-cell"
                href="https://picsum.photos/id/10/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/10/720/480"
                    alt="Sample photo 1"
                />
            </a>
            <a
                class="carousel-cell"
                href="https://picsum.photos/id/11/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/11/720/480"
                    alt="Sample photo 2"
                />
            </a>
            <a
                class="carousel-cell"
                href="https://picsum.photos/id/15/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/15/720/480"
                    alt="Sample photo 3"
                />
            </a>
            <a
                class="carousel-cell"
                href="https://picsum.photos/id/16/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/16/720/480"
                    alt="Sample photo 4"
                />
            </a>
            <a
                class="carousel-cell"
                href="https://picsum.photos/id/28/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/28/720/480"
                    alt="Sample photo 5"
                />
            </a>
            <a
                class="carousel-cell"
                href="https://picsum.photos/id/29/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/29/720/480"
                    alt="Sample photo 6"
                />
            </a>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
