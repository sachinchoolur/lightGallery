<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery justified layout example</title>
    </head>
    <body>
        <h1>lightGallery justified layout</h1>

        <!-- data-lg-size is the full-size image's WIDTH-HEIGHT. The layout
             takes each photo's shape from it, so the rows are known before
             the thumbnails load. The lg-justified class keeps the
             thumbnails hidden until the rows are in place. -->
        <div id="gallery" class="lg-justified">
            <a
                href="https://picsum.photos/id/10/1600/1200"
                data-lg-size="1600-1200"
            >
                <img
                    src="https://picsum.photos/id/10/400/300"
                    alt="Sample photo 1"
                />
            </a>
            <a
                href="https://picsum.photos/id/11/1200/1600"
                data-lg-size="1200-1600"
            >
                <img
                    src="https://picsum.photos/id/11/300/400"
                    alt="Sample photo 2"
                />
            </a>
            <a
                href="https://picsum.photos/id/15/1600/900"
                data-lg-size="1600-900"
            >
                <img
                    src="https://picsum.photos/id/15/400/225"
                    alt="Sample photo 3"
                />
            </a>
            <a
                href="https://picsum.photos/id/16/1200/1200"
                data-lg-size="1200-1200"
            >
                <img
                    src="https://picsum.photos/id/16/300/300"
                    alt="Sample photo 4"
                />
            </a>
            <a
                href="https://picsum.photos/id/28/1600/1000"
                data-lg-size="1600-1000"
            >
                <img
                    src="https://picsum.photos/id/28/400/250"
                    alt="Sample photo 5"
                />
            </a>
            <a
                href="https://picsum.photos/id/29/1000/1600"
                data-lg-size="1000-1600"
            >
                <img
                    src="https://picsum.photos/id/29/250/400"
                    alt="Sample photo 6"
                />
            </a>
            <a
                href="https://picsum.photos/id/37/1600/1200"
                data-lg-size="1600-1200"
            >
                <img
                    src="https://picsum.photos/id/37/400/300"
                    alt="Sample photo 7"
                />
            </a>
            <a
                href="https://picsum.photos/id/110/1600/800"
                data-lg-size="1600-800"
            >
                <img
                    src="https://picsum.photos/id/110/400/200"
                    alt="Sample photo 8"
                />
            </a>
            <a
                href="https://picsum.photos/id/43/1200/1600"
                data-lg-size="1200-1600"
            >
                <img
                    src="https://picsum.photos/id/43/300/400"
                    alt="Sample photo 9"
                />
            </a>
            <a
                href="https://picsum.photos/id/49/1600/900"
                data-lg-size="1600-900"
            >
                <img
                    src="https://picsum.photos/id/49/400/225"
                    alt="Sample photo 10"
                />
            </a>
            <a
                href="https://picsum.photos/id/57/1600/1200"
                data-lg-size="1600-1200"
            >
                <img
                    src="https://picsum.photos/id/57/400/300"
                    alt="Sample photo 11"
                />
            </a>
            <a
                href="https://picsum.photos/id/65/1200/1200"
                data-lg-size="1200-1200"
            >
                <img
                    src="https://picsum.photos/id/65/300/300"
                    alt="Sample photo 12"
                />
            </a>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
