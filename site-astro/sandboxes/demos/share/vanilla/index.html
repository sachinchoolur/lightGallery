<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery social sharing example</title>
    </head>
    <body>
        <h1>lightGallery social sharing</h1>

        <!-- data-tweet-text and data-pinterest-text are the text the post on
             X and the pin on Pinterest start with. -->
        <div id="gallery" class="gallery">
            <a
                href="https://picsum.photos/id/10/1600/1067"
                data-lg-size="1600-1067"
                data-tweet-text="Sample photo 1, shared from lightGallery"
                data-pinterest-text="Sample photo 1"
            >
                <img
                    src="https://picsum.photos/id/10/360/240"
                    alt="Sample photo 1"
                />
            </a>
            <a
                href="https://picsum.photos/id/11/1600/1067"
                data-lg-size="1600-1067"
                data-tweet-text="Sample photo 2, shared from lightGallery"
                data-pinterest-text="Sample photo 2"
            >

                    src="https://picsum.photos/id/11/360/240"
                    alt="Sample photo 2"
                />
            </a>
            <a
                href="https://picsum.photos/id/15/1600/1067"
                data-lg-size="1600-1067"
                data-tweet-text="Sample photo 3, shared from lightGallery"
                data-pinterest-text="Sample photo 3"
            >

                    src="https://picsum.photos/id/15/360/240"
                    alt="Sample photo 3"
                />
            </a>
            <a
                href="https://picsum.photos/id/16/1600/1067"

            <a
                href="https://picsum.photos/id/28/1600/1067"

            <a

        </div>

        <script type="module" src="/src/main.js"></script>

</html>
