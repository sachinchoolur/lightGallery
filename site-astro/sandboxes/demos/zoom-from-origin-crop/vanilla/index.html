<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery zoom from origin, cropped thumbnails</title>
    </head>
    <body>
        <h1>lightGallery zoom from origin, cropped thumbnails</h1>

        <!-- data-lg-size is the full-size image's WIDTH-HEIGHT; the flight
             needs it. Each tile's object-position picks the part of the
             photo it shows, and the flight starts from that part. -->
        <div id="gallery" class="tiles">
            <a
                href="https://picsum.photos/id/10/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/10/480/320"
                    alt="Sample photo 1"
                    style="object-position: 0% 50%"
                />
            </a>
            <a
                href="https://picsum.photos/id/11/1067/1600"
                data-lg-size="1067-1600"
            >
                <img
                    src="https://picsum.photos/id/11/320/480"
                    alt="Sample photo 2"
                    style="object-position: 50% 0%"
                />
            </a>
            <a
                href="https://picsum.photos/id/15/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/15/480/320"
                    alt="Sample photo 3"
                    style="object-position: 50% 50%"
                />
            </a>
            <a
                href="https://picsum.photos/id/16/1067/1600"
                data-lg-size="1067-1600"
            >
                <img
                    src="https://picsum.photos/id/16/320/480"
                    alt="Sample photo 4"
                    style="object-position: 50% 100%"
                />
            </a>
            <a
                href="https://picsum.photos/id/28/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/28/480/320"
                    alt="Sample photo 5"
                    style="object-position: 100% 50%"
                />
            </a>
            <a
                href="https://picsum.photos/id/29/1067/1600"
                data-lg-size="1067-1600"
            >
                <img
                    src="https://picsum.photos/id/29/320/480"
                    alt="Sample photo 6"
                    style="object-position: 50% 50%"
                />
            </a>
            <a
                href="https://picsum.photos/id/37/1600/1067"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/37/480/320"
                    alt="Sample photo 7"
                    style="object-position: 50% 50%"
                />
            </a>
            <a
                href="https://picsum.photos/id/110/1067/1600"
                data-lg-size="1067-1600"
            >
                <img
                    src="https://picsum.photos/id/110/320/480"
                    alt="Sample photo 8"
                    style="object-position: 50% 0%"
                />
            </a>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
