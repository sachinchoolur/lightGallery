<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery RTL example</title>
    </head>
    <body>
        <h1>lightGallery RTL</h1>

        <!-- dir="rtl" makes this a right-to-left gallery: the grid is
             mirrored, and the gallery picks the direction up from here. -->
        <div id="gallery" class="gallery" dir="rtl">
            <a
                href="https://picsum.photos/id/10/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة الأولى</h4>"
            >
                <img
                    src="https://picsum.photos/id/10/360/240"
                    alt="الصورة الأولى"
                />
            </a>
            <a
                href="https://picsum.photos/id/11/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة الثانية</h4>"
            >
                <img
                    src="https://picsum.photos/id/11/360/240"
                    alt="الصورة الثانية"
                />
            </a>
            <a
                href="https://picsum.photos/id/15/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة الثالثة</h4>"
            >
                <img
                    src="https://picsum.photos/id/15/360/240"
                    alt="الصورة الثالثة"
                />
            </a>
            <a
                href="https://picsum.photos/id/16/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة الرابعة</h4>"
            >
                <img
                    src="https://picsum.photos/id/16/360/240"
                    alt="الصورة الرابعة"
                />
            </a>
            <a
                href="https://picsum.photos/id/28/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة الخامسة</h4>"
            >
                <img
                    src="https://picsum.photos/id/28/360/240"
                    alt="الصورة الخامسة"
                />
            </a>
            <a
                href="https://picsum.photos/id/29/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة السادسة</h4>"
            >
                <img
                    src="https://picsum.photos/id/29/360/240"
                    alt="الصورة السادسة"
                />
            </a>
            <a
                href="https://picsum.photos/id/37/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة السابعة</h4>"
            >
                <img
                    src="https://picsum.photos/id/37/360/240"
                    alt="الصورة السابعة"
                />
            </a>
            <a
                href="https://picsum.photos/id/110/1600/1067"
                data-lg-size="1600-1067"
                data-sub-html="<h4>الصورة الثامنة</h4>"
            >
                <img
                    src="https://picsum.photos/id/110/360/240"
                    alt="الصورة الثامنة"
                />
            </a>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
