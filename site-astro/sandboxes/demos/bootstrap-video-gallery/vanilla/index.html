<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery with a Bootstrap video gallery example</title>
    </head>
    <body>
        <h1>lightGallery with a Bootstrap video gallery</h1>

        <!-- A Bootstrap grid whose columns are the video items: data-src is
             the video's URL and data-poster the image shown before it plays. -->
        <div class="row g-3" id="bootstrap-video-gallery">
            <a
                class="col-sm-4"
                data-lg-size="1280-720"
                data-src="https://www.youtube.com/watch?v=EIUJfXk3_3w"
                data-poster="https://img.youtube.com/vi/EIUJfXk3_3w/maxresdefault.jpg"
            >
                <img
                    class="img-fluid"
                    src="https://img.youtube.com/vi/EIUJfXk3_3w/maxresdefault.jpg"
                    alt="YouTube video"
                />
            </a>
            <a
                class="col-sm-4"
                data-lg-size="1280-720"
                data-src="https://vimeo.com/112836958"
                data-poster="https://www.lightgalleryjs.com/images/demo/vimeo-video-poster.jpg"
            >
                <img
                    class="img-fluid"
                    src="https://www.lightgalleryjs.com/images/demo/vimeo-video-poster.jpg"
                    alt="Vimeo video"
                />
            </a>
            <!-- An HTML5 video has no data-src; its sources go in data-video
                 as JSON. -->
            <a
                class="col-sm-4"
                data-lg-size="1280-720"
                data-video='{"source": [{"src": "https://www.lightgalleryjs.com/videos/video1.mp4", "type": "video/mp4"}], "attributes": {"preload": false, "controls": true}}'
                data-poster="https://www.lightgalleryjs.com/images/demo/html5-video-poster.jpg"
            >
                <img
                    class="img-fluid"
                    src="https://www.lightgalleryjs.com/images/demo/html5-video-poster.jpg"
                    alt="HTML5 video"
                />
            </a>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
