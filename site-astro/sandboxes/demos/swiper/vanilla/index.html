<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery with Swiper example</title>
    </head>
    <body>
        <h1>lightGallery with a Swiper carousel</h1>

        <!-- Every slide links to its full-size image. data-lg-size is that
             image's WIDTH-HEIGHT; it lets the image open from its slide. -->
        <div class="swiper">
            <div id="lg-swiper" class="swiper-wrapper">
                <a
                    class="swiper-slide"
                    href="https://picsum.photos/id/10/1600/1067"
                    data-lg-size="1600-1067"
                >
                    <img
                        src="https://picsum.photos/id/10/960/640"
                        alt="Sample photo 1"
                    />
                </a>
                <a
                    class="swiper-slide"
                    href="https://picsum.photos/id/11/1600/1067"
                    data-lg-size="1600-1067"
                >
                    <img
                        src="https://picsum.photos/id/11/960/640"
                        alt="Sample photo 2"
                    />
                </a>
                <a
                    class="swiper-slide"
                    href="https://picsum.photos/id/15/1600/1067"
                    data-lg-size="1600-1067"
                >
                    <img
                        src="https://picsum.photos/id/15/960/640"
                        alt="Sample photo 3"
                    />
                </a>
                <a
                    class="swiper-slide"
                    href="https://picsum.photos/id/16/1600/1067"
                    data-lg-size="1600-1067"
                >
                    <img
                        src="https://picsum.photos/id/16/960/640"
                        alt="Sample photo 4"
                    />
                </a>
            </div>

            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
