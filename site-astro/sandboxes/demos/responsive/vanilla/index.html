<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lightGallery responsive images example</title>
    </head>
    <body>
        <h1>lightGallery responsive images</h1>

        <!-- data-responsive lists smaller versions of the image, each
             followed by the viewport width (px) below which it is used.
             From 800px up, the href is used. -->
        <div id="gallery" class="gallery">
            <a
                href="https://picsum.photos/id/10/1600/1067"
                data-responsive="https://picsum.photos/id/10/480/320 480, https://picsum.photos/id/10/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/10/360/240"
                    alt="Sample photo 1"
                />
            </a>
            <a
                href="https://picsum.photos/id/11/1600/1067"
                data-responsive="https://picsum.photos/id/11/480/320 480, https://picsum.photos/id/11/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/11/360/240"
                    alt="Sample photo 2"
                />
            </a>
            <a
                href="https://picsum.photos/id/15/1600/1067"
                data-responsive="https://picsum.photos/id/15/480/320 480, https://picsum.photos/id/15/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/15/360/240"
                    alt="Sample photo 3"
                />
            </a>
            <a
                href="https://picsum.photos/id/16/1600/1067"
                data-responsive="https://picsum.photos/id/16/480/320 480, https://picsum.photos/id/16/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/16/360/240"
                    alt="Sample photo 4"
                />
            </a>
            <a
                href="https://picsum.photos/id/28/1600/1067"
                data-responsive="https://picsum.photos/id/28/480/320 480, https://picsum.photos/id/28/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/28/360/240"
                    alt="Sample photo 5"
                />
            </a>
            <a
                href="https://picsum.photos/id/29/1600/1067"
                data-responsive="https://picsum.photos/id/29/480/320 480, https://picsum.photos/id/29/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/29/360/240"
                    alt="Sample photo 6"
                />
            </a>
            <a

                data-responsive="https://picsum.photos/id/37/480/320 480, https://picsum.photos/id/37/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/37/360/240"
                    alt="Sample photo 7"
                />
            </a>
            <a
                href="https://picsum.photos/id/110/1600/1067"
                data-responsive="https://picsum.photos/id/110/480/320 480, https://picsum.photos/id/110/800/533 800"
                data-lg-size="1600-1067"
            >
                <img
                    src="https://picsum.photos/id/110/360/240"
                    alt="Sample photo 8"
                />
            </a>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
